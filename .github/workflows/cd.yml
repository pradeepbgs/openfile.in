name: Deploy to ec2

on:
  push:
    branches:
      - main

jobs:
   deploy:
      runs-on: ubuntu-latest
      
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Bun (Runner Cache)
          uses: oven-sh/setup-bun@v2
          with:
            bun-version: latest
            cache: "bun"
            cache-node-modules: true

        - name: Deploy to the server
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY_OPENFILE }}
            script: |
              # 1. Environment Check & Tooling Setup
              if ! command -v bun &> /dev/null; then
                  echo "[Environment] Installing Bun..."
                  curl -fsSL https://bun.sh/install | bash
              fi
              
              # Ensure path is set for this session (even if not in .bashrc yet)
              export BUN_INSTALL="$HOME/.bun"
              export PATH="$BUN_INSTALL/bin:$PATH"

              if ! command -v pm2 &> /dev/null; then
                  echo "[Environment] Installing PM2..."
                  # Try npm first, fallback to bun global install
                  npm install -g pm2 || bun add -g pm2
              fi

              # 2. Project Update
              echo "[Project] Updating codebase..."
              if [ ! -d "openfile.in" ]; then
                  git clone https://github.com/pradeepbgs/openfile.in.git
              fi
              cd openfile.in
              git fetch origin
              git reset --hard origin/main
              
              # 3. Backend Deployment
              cd apps/backend
              echo "[Project] Installing dependencies..."
              bun install
              
              echo "[Project] Starting server with PM2..."
              chmod +x ./pm2.sh
              ./pm2.sh
               