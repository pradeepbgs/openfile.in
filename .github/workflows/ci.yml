name: openfile backend

# Disabled: superseded by docker-build.yml. Trigger manually if needed.
on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build our application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      # Write .env file
      - name: Write .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env
        
        # Run migrations
      # - name: Prisma migrate
      #   run: bunx prisma migrate dev --name updated_model

      # - name: Generate Prisma Client
      #   run: bunx prisma generate
      
      # - name: Push Prisma schema to DB
      #   run: bunx prisma db push

      - name: Run tests
        run: bun run test --timeout=20000
