# Local development override: runs a local Redis instead of the shared VPS one.
# Usage: docker compose -f compose.yml -f compose.dev.yml up
services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  backend:
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

networks:
  # in dev the "infra" network is created locally instead of being shared
  infra:
    external: false

volumes:
  redis_data:
