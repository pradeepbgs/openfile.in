services:
  backend:
    image: ghcr.io/exvillager/openfile-backend:latest
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    networks:
      - infra
      - default

networks:
  infra:
    external: true
